[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infestation-gym-openenv"
version = "0.1.0"
description = "OpenEnv project bundled with a verifiers environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]==0.2.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
]
